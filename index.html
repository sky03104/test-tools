<script>
"use strict";

/* ============================================================
   天鷹保全 V2.5 Enterprise
   JavaScript Core
============================================================ */

const CONFIG = {

    API_URL:
    "https://script.google.com/macros/s/AKfycby8wWysK9AeiXzVlfB2MSyyxgrBLp7T6W0i-cKl-7RFHi2TL2P0gTw2btCpwJo_m6Mq/exec",

    JPEG_QUALITY:0.82,

    MAX_WIDTH:1000,

    AUTO_NEXT_DELAY:500,

    NIGHT_MODE:true

};

const state={

    busy:false,

    imageBase64:"",

    recent:[]

};

/* ============================================================
DOM
============================================================ */

const cameraInput=document.getElementById("cameraInput");
const canvas=document.getElementById("canvas");

const plateResult=document.getElementById("plateResult");
const plateInput=document.getElementById("plateInput");

const vehicleType=document.getElementById("vehicleType");
const operator=document.getElementById("operator");

const btnCamera=document.getElementById("btnCamera");
const btnRetake=document.getElementById("btnRetake");
const btnAI=document.getElementById("btnAI");
const btnSave=document.getElementById("btnSave");

const loading=document.getElementById("loading");
const successLayer=document.getElementById("successLayer");

const recentList=document.getElementById("recentList");

/* ============================================================
初始化
============================================================ */

window.addEventListener("load",()=>{

    restoreRecent();

    bindEvents();

});

/* ============================================================
事件
============================================================ */

function bindEvents(){

    btnCamera.onclick=openCamera;

    btnRetake.onclick=openCamera;

    btnAI.onclick=recognizePlate;

    btnSave.onclick=saveVehicle;

    cameraInput.onchange=onImageSelected;

}

/* ============================================================
開啟相機
============================================================ */

function openCamera(){

    if(state.busy) return;

    cameraInput.value="";

    cameraInput.click();

}

/* ============================================================
選擇照片
============================================================ */

async function onImageSelected(e){

    const file=e.target.files[0];

    if(!file) return;

    state.imageBase64=await compressImage(file);

}

/* ============================================================
Canvas最佳化
============================================================ */

async function compressImage(file){

    return new Promise(resolve=>{

        const img=new Image();

        img.onload=()=>{

            const ctx=canvas.getContext("2d");

            let w=img.width;
            let h=img.height;

            if(w>CONFIG.MAX_WIDTH){

                h*=CONFIG.MAX_WIDTH/w;
                w=CONFIG.MAX_WIDTH;

            }

            canvas.width=w;
            canvas.height=h;

            if(CONFIG.NIGHT_MODE){

                ctx.filter="contrast(120%) brightness(110%)";

            }else{

                ctx.filter="none";

            }

            ctx.drawImage(img,0,0,w,h);

            resolve(

                canvas.toDataURL(
                    "image/jpeg",
                    CONFIG.JPEG_QUALITY
                )

            );

        };

        img.src=URL.createObjectURL(file);

    });

}

/* ============================================================
AI辨識
============================================================ */

async function recognizePlate(){

    if(state.busy) return;

    if(!state.imageBase64){

        alert("請先拍照");

        return;

    }

    state.busy=true;

    lockButtons(true);

    showLoading(true);

    try{

        const res=await fetch(CONFIG.API_URL,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                action:"recognizePlate",

                imageBase64:state.imageBase64

            })

        });

        const json=await res.json();

        if(!json.success){

            throw json.error;

        }

        const plate=normalizePlate(json.plate);

        plateInput.value=plate;

        plateResult.textContent=plate;

    }catch(err){

        alert(err);

    }

    showLoading(false);

    lockButtons(false);

    state.busy=false;

}

/* ============================================================
車牌修正
============================================================ */

function normalizePlate(text){

    if(!text) return "";

    text=text.toUpperCase();

    text=text.replace(/\s/g,"");

    text=text.replace(/O/g,"0");

    text=text.replace(/I/g,"1");

    text=text.replace(/S/g,"5");

    text=text.replace(/B/g,"8");

    text=text.replace(/Z/g,"2");

    return text;

}

/* ============================================================
送出
============================================================ */

async function saveVehicle(){

    if(state.busy) return;

    if(!plateInput.value){

        alert("請先辨識車牌");

        return;

    }

    state.busy=true;

    lockButtons(true);

    try{

        const res=await fetch(CONFIG.API_URL,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                action:"vehicleReg",

                plate:plateInput.value,

                operator:operator.value,

                typeLabel:vehicleType.value

            })

        });

        const json=await res.json();

        if(!json.success){

            throw json.error;

        }

        addRecent(

            plateInput.value,

            vehicleType.value

        );

        playSuccess();

    }catch(err){

        alert(err);

        state.busy=false;

        lockButtons(false);

    }

}

/* ============================================================
成功動畫
============================================================ */

function playSuccess(){

    successLayer.classList.add("show");

    setTimeout(()=>{

        successLayer.classList.remove("show");

        state.busy=false;

        lockButtons(false);

        plateInput.value="";

        plateResult.textContent="------";

        state.imageBase64="";

        openCamera();

    },CONFIG.AUTO_NEXT_DELAY);

}

/* ============================================================
按鈕鎖定
============================================================ */

function lockButtons(disabled){

    btnCamera.disabled=disabled;
    btnRetake.disabled=disabled;
    btnAI.disabled=disabled;
    btnSave.disabled=disabled;

}

/* ============================================================
Loading
============================================================ */

function showLoading(show){

    loading.classList.toggle("show",show);

}

/* ============================================================
最近10筆
============================================================ */

function addRecent(plate,type){

    state.recent.unshift({

        plate,

        type,

        time:new Date().toLocaleTimeString()

    });

    state.recent=state.recent.slice(0,10);

    localStorage.setItem(

        "recentVehicles",

        JSON.stringify(state.recent)

    );

    renderRecent();

}

function restoreRecent(){

    const cache=localStorage.getItem("recentVehicles");

    if(cache){

        state.recent=JSON.parse(cache);

    }

    renderRecent();

}

function renderRecent(){

    if(state.recent.length===0){

        recentList.innerHTML=

        '<div class="empty">尚無資料</div>';

        return;

    }

    recentList.innerHTML="";

    state.recent.forEach(item=>{

        const div=document.createElement("div");

        div.className="recent-item";

        div.innerHTML=

        `
        <div>
            <strong>${item.plate}</strong>
            <br>
            <small>${item.type}</small>
        </div>

        <small>${item.time}</small>
        `;

        recentList.appendChild(div);

    });

}

</script>

<script>

/* ============================================================
Toast
============================================================ */

function toast(msg){

const t=document.getElementById("toast");

t.textContent=msg;

t.classList.add("show");

clearTimeout(t.timer);

t.timer=setTimeout(()=>{

t.classList.remove("show");

},2200);

}

/* ============================================================
夜拍增強
============================================================ */

function enhanceNight(ctx,w,h){

const img=ctx.getImageData(0,0,w,h);

const d=img.data;

const gamma=0.85;

for(let i=0;i<d.length;i+=4){

d[i]=255*Math.pow(d[i]/255,gamma);
d[i+1]=255*Math.pow(d[i+1]/255,gamma);
d[i+2]=255*Math.pow(d[i+2]/255,gamma);

}

ctx.putImageData(img,0,0);

}

/* ============================================================
車牌格式驗證
============================================================ */

function validatePlate(plate){

plate=plate.trim().toUpperCase();

const rules=[

/^[A-Z]{2,4}\-[0-9]{2,4}$/,

/^[A-Z]{2,4}[0-9]{2,4}$/,

/^[0-9]{2,4}\-[A-Z]{2,4}$/

];

return rules.some(r=>r.test(plate));

}

/* ============================================================
Retry OCR
============================================================ */

async function recognizeWithRetry(maxRetry=3){

let lastError;

for(let i=0;i<maxRetry;i++){

try{

await recognizePlate();

return;

}catch(e){

lastError=e;

}

}

throw lastError;

}

/* ============================================================
AI提示
============================================================ */

function showAIHint(msg){

toast("🤖 "+msg);

}

/* ============================================================
重新包裝辨識流程
============================================================ */

const oldRecognize=recognizePlate;

recognizePlate=async function(){

try{

await oldRecognize();

if(!validatePlate(plateInput.value)){

showAIHint("辨識完成，建議確認車牌格式");

}else{

toast("辨識成功");

}

}catch(e){

showAIHint("請靠近一點或重新拍照");

throw e;

}

};

/* ============================================================
重新包裝送出流程
============================================================ */

const oldSave=saveVehicle;

saveVehicle=async function(){

if(!validatePlate(plateInput.value)){

if(!confirm("車牌格式可能有誤，仍要送出？")){

return;

}

}

await oldSave();

};

/* ============================================================
Enter直接送出
============================================================ */

plateInput.addEventListener("keydown",e=>{

if(e.key==="Enter"){

saveVehicle();

}

});

/* ============================================================
輸入自動大寫
============================================================ */

plateInput.addEventListener("input",()=>{

plateInput.value=plateInput.value.toUpperCase();

});

/* ============================================================
完成
============================================================ */

console.log(

"%c 天鷹保全 V2.5 Enterprise Ready",

"color:#FFD700;font-size:16px;font-weight:bold;"

);

toast("天鷹保全 V2.5 已啟動");

</script>

<script>

const APP={

/* ============================================================
OCR快取
============================================================ */

let lastOCR={

plate:"",
time:0

};

function getCachePlate(){

const now=Date.now();

if(

lastOCR.plate &&
(now-lastOCR.time)<APP.CACHE_TIME

){

return lastOCR.plate;

}

return null;

}

function setCachePlate(plate){

lastOCR.plate=plate;

lastOCR.time=Date.now();

}

/* ============================================================
辨識速度計算
============================================================ */

let aiStart=0;

function startTimer(){

aiStart=performance.now();

}

function stopTimer(){

const ms=Math.round(

performance.now()-aiStart

);

toast("AI完成 "+ms+" ms");

}

/* ============================================================
覆寫辨識流程
============================================================ */

const recognizePlateCore=recognizePlate;

recognizePlate=async()=>{

const cache=getCachePlate();

if(cache){

plateInput.value=cache;

plateResult.textContent=cache;

toast("使用最近辨識");

return;

}

startTimer();

await recognizePlateCore();

stopTimer();

setCachePlate(

plateInput.value

);

};

/* ============================================================
智慧車牌修正
============================================================ */

function fixTaiwanPlate(text){

text=text.toUpperCase();

const arr=text.split("");

for(let i=0;i<arr.length;i++){

const c=arr[i];

if(i<4){

if(c==="0") arr[i]="O";
if(c==="1") arr[i]="I";
if(c==="2") arr[i]="Z";
if(c==="5") arr[i]="S";
if(c==="8") arr[i]="B";

}else{

if(c==="O") arr[i]="0";
if(c==="I") arr[i]="1";
if(c==="Z") arr[i]="2";
if(c==="S") arr[i]="5";
if(c==="B") arr[i]="8";

}

}

return arr.join("");

}

AI修正

fixTaiwanPlate(

plateInput.value

);

plateInput.value;

function beep(freq=880,time=120){

ctx.currentTime

);

ctx.currentTime+

time/1000

);

}catch(e){}
