<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>過夜車輛登記</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0A0C10; font-family: sans-serif; color: #F5F5F5; min-height: 100vh; }
    .screen { display:none; padding:16px; }
    .screen.active { display:block; }
    .reg-card { display:flex; align-items:center; gap:14px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:16px; margin-bottom:12px; cursor:pointer; }
    .camera-zone { background:rgba(255,255,255,.04); border:2px dashed rgba(255,255,255,.12); border-radius:14px; padding:40px 20px; text-align:center; cursor:pointer; }
    .camera-zone img { width:100%; max-height:250px; object-fit:contain; }
    .field-input { width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:15px; color:#FFD700; font-size:24px; text-align:center; margin:15px 0; }
    .btn-primary { width:100%; background:linear-gradient(135deg,#C9A227,#D4A800); color:#000; border:none; border-radius:12px; padding:15px; font-weight:900; }
    .ocr-progress { display:none; color:#FFD700; text-align:center; margin-bottom:10px; }
    .ocr-progress.show { display:block; }
    .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); padding:10px 20px; border-radius:20px; display:none; z-index:999; }
  </style>
</head>
<body>

<div id="screen-select" class="screen active">
  <h2 style="margin-bottom:20px;">選擇登記項目</h2>
  <div class="reg-card" onclick="openOCR('moto')">🏍️ 館內機車過夜登記</div>
  <div class="reg-card" onclick="openOCR('car')">🚗 館內汽車過夜登記</div>
  <div class="reg-card" onclick="openOCR('park')">🅿️ 新莊停車場登記</div>
</div>

<div id="screen-ocr" class="screen">
    <button onclick="goToSelect()" style="color:#aaa; background:none; border:none; margin-bottom:10px;">← 返回</button>
    <div id="cameraZone" class="camera-zone" onclick="triggerCamera()">
        <i class="ti ti-camera" style="font-size:40px;"></i><br>點擊拍照
    </div>
    <div id="ocrProgress" class="ocr-progress">AI 辨識中，請稍候...</div>
    <input type="text" class="field-input" id="plateInput" placeholder="車牌號碼" />
    <button class="btn-primary" id="submitBtn" onclick="submitReg()">確認登記</button>
</div>

<div id="screen-success" class="screen" style="text-align:center;">
    <h2 style="color:#4ADE80;">✅ 登記完成</h2>
    <div id="successPlate" style="font-size:30px; margin:20px 0;"></div>
    <button class="btn-primary" onclick="goToSelect()">返回主選單</button>
</div>

<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
<div id="toast" class="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycby8wWysK9AeiXzVlfB2MSyyxgrBLp7T6W0i-cKl-7RFHi2TL2P0gTw2btCpwJo_m6Mq/exec'; // <--- 這裡一定要換成最新的

let currentType = '';
const TYPE_LABEL = { moto:'館內機車', car:'館內汽車', park:'新莊停車場' };

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function openOCR(type) {
  currentType = type;
  document.getElementById('plateInput').value = '';
  document.getElementById('cameraZone').innerHTML = '點擊拍照';
  showScreen('screen-ocr');
}

function goToSelect() { showScreen('screen-select'); }
function triggerCamera() { document.getElementById('cameraInput').click(); }

document.getElementById('cameraInput').onchange = async function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async (event) => {
    document.getElementById('cameraZone').innerHTML = `<img src="${event.target.result}">`;
    document.getElementById('ocrProgress').classList.add('show');
    
    // 壓縮照片
    const base64 = await compressImage(file);
    
    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'recognizePlate', imageBase64: base64 })
      });
      const data = await res.json();
      document.getElementById('ocrProgress').classList.remove('show');
      
      if (data.success) {
        document.getElementById('plateInput').value = data.plate;
        showToast('辨識成功！');
      } else {
        // 如果失敗，直接顯示詳細原因
        alert("辨識出錯了！\n原因：" + data.error);
      }
    } catch (err) {
      document.getElementById('ocrProgress').classList.remove('show');
      alert("連線失敗，請檢查網路或 GAS 網址是否正確。");
    }
  };
  reader.readAsDataURL(file);
};

function compressImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    img.src = URL.createObjectURL(file);
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const max = 1000;
      let w = img.width, h = img.height;
      if (w > h && w > max) { h *= max/w; w = max; }
      else if (h > max) { w *= max/h; h = max; }
      canvas.width = w; canvas.height = h;
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.8).split(',')[1]);
    };
  });
}

async function submitReg() {
  const plate = document.getElementById('plateInput').value;
  if (!plate) return alert('請輸入車牌');
  const res = await fetch(GAS_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'vehicleReg', type: currentType, typeLabel: TYPE_LABEL[currentType], plate: plate, operator: '手機端' })
  });
  const data = await res.json();
  if (data.success) {
    document.getElementById('successPlate').innerText = plate;
    showScreen('screen-success');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}
</script>
</body>
</html>
